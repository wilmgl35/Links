<!DOCTYPE html>

<head>

<title>@you — links</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }

.coffee-btn { position: fixed; bottom: 20px; right: 20px; background: #ffdd00; color: #000; padding: 12px 16px; border-radius: 50px; font-weight: 600; text-decoration: none; }
